<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>SSH Term</title>
<link rel="stylesheet" href="/open.css">
<script type="module" src="/open.js"></script>
</head>
<body>
<main>
  <h1><span class="prompt" aria-hidden="true">&gt;_</span> SSH Term</h1>
  <p id="invalid" class="note" data-t="invalid" hidden></p>
  <p id="desktop" class="note" data-t="desktop" hidden></p>
  <a id="open" class="button" data-t="open" hidden></a>
  <section id="trouble" hidden>
    <h2 data-t="trouble"></h2>
    <ul>
      <li data-t="inApp"></li>
      <li data-t="owner"></li>
    </ul>
    <h2 data-t="getApp"></h2>
    <p id="stores">
      <a id="appstore" class="store" href="https://apps.apple.com/app/id6759213045">App Store</a>
      <a id="play" class="store" href="https://play.google.com/store/apps/details?id=com.obuto.sshterm">Google Play</a>
    </p>
  </section>
  <noscript><p class="note">Turn on JavaScript to open this link in SSH Term.</p></noscript>
</main>
</body>
</html>
