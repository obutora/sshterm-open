<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>ライセンスキー · SSH Term Desktop</title>
<link rel="icon" href="/icon.png">
<link rel="stylesheet" href="/sheet.css">
<link rel="stylesheet" href="/legal.css">
<link rel="stylesheet" href="/desktop.css">
<script type="module" src="/purchased.js"></script>
</head>
<body>
<div class="sheet">
<div class="bar">
  <a class="mark" href="/ja/desktop"><span class="glyph" aria-hidden="true">&gt;_</span>SSH Term Desktop</a>
</div>
<div class="hero">
  <h1>ライセンスキー</h1>
</div>
<main>
  <section>
    <p id="status" aria-live="polite"></p>
    <noscript><p>ライセンスキーを見るには JavaScript をオンにしてください。キーはメールでもお送りしています。</p></noscript>
    <div id="result" class="license" hidden>
      <label class="label" for="key">ライセンスキー</label>
      <textarea id="key" readonly rows="3" spellcheck="false"></textarea>
      <button id="copy" type="button"></button>
      <a id="open" class="button" href="#">SSH Term Desktop で開く</a>
      <p>ボタンでアプリが開かないときは、キーをコピーして、アプリの「ライセンスキー」の欄に貼り付けてください。</p>
      <p>このキーは、ご自分の Mac と Windows の PC なら何台でも使えます。なくしたら、同じキーをメールで送り直せます。</p>
    </div>
  </section>
</main>
<div class="foot">
  <a href="/ja/terms">利用規約</a>
  <a href="/ja/privacy">プライバシーポリシー</a>
  <span class="coord">sshterm.iru-yo.com/ja/desktop/purchased</span>
</div>
</div>
</body>
</html>
